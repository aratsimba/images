
# =============================================
# Religious Organization Calendar App
# REST API Specification v1.0
# =============================================
# Base URL: /api/v1
# Auth: OAuth 2.0 + JWT Bearer Token
# Content-Type: application/json
# =============================================

info:
  title: Religious Organization Calendar API
  version: 1.0.0
  description: |
    Full REST API for the Religious Organization Calendar Application (ROCA).
    All endpoints require JWT authentication unless marked [PUBLIC].
    Multi-tenancy is enforced via org_id extracted from the JWT claims.

# =============================================
# AUTHENTICATION & AUTHORIZATION
# =============================================

auth:
  type: OAuth 2.0 / JWT
  flows:
    - authorization_code (web app)
    - refresh_token (session renewal)
    - client_credentials (service-to-service)
  token_endpoint: /api/v1/auth/token
  refresh_endpoint: /api/v1/auth/refresh
  revoke_endpoint: /api/v1/auth/revoke

roles:
  - super_admin    # Platform-level admin (multi-org)
  - pastor         # Full org access + spiritual content
  - admin          # Full org access (non-spiritual)
  - leader         # Ministry/group leaders — manage their scope
  - volunteer      # View schedule, confirm/decline assignments
  - member         # View public + member events, RSVP
  - guest          # [PUBLIC] View public events only

# =============================================
# RBAC PERMISSION MATRIX
# =============================================
#
# Resource              | guest | member | volunteer | leader | admin | pastor
# ----------------------|-------|--------|-----------|--------|-------|-------
# Public events (read)  |  ✓   |   ✓    |     ✓     |   ✓    |   ✓   |   ✓
# Member events (read)  |  ✗   |   ✓    |     ✓     |   ✓    |   ✓   |   ✓
# Leader events (read)  |  ✗   |   ✗    |     ✗     |   ✓    |   ✓   |   ✓
# Events (create/edit)  |  ✗   |   ✗    |     ✗     |   ✓*   |   ✓   |   ✓
# Events (delete)       |  ✗   |   ✗    |     ✗     |   ✗    |   ✓   |   ✓
# RSVP (own)            |  ✗   |   ✓    |     ✓     |   ✓    |   ✓   |   ✓
# Registrations (all)   |  ✗   |   ✗    |     ✗     |   ✓*   |   ✓   |   ✓
# Volunteers (view own) |  ✗   |   ✗    |     ✓     |   ✓    |   ✓   |   ✓
# Volunteers (assign)   |  ✗   |   ✗    |     ✗     |   ✓*   |   ✓   |   ✓
# Scripture (manage)    |  ✗   |   ✗    |     ✗     |   ✗    |   ✗   |   ✓
# Members (manage)      |  ✗   |   ✗    |     ✗     |   ✗    |   ✓   |   ✓
# Org settings          |  ✗   |   ✗    |     ✗     |   ✗    |   ✓   |   ✓
#
# ✓* = scoped to their ministry group/campus

# =============================================
# ENDPOINTS
# =============================================

# -------------------------------------------
# AUTH
# -------------------------------------------
endpoints:

  - path: /api/v1/auth/register
    method: POST
    description: Register a new member (pending admin approval)
    access: PUBLIC
    request_body:
      first_name: string (required)
      last_name: string (required)
      email: string (required)
      password: string (required)
      org_id: uuid (required)
    response: 201 Created
      member_id: uuid
      status: pending_approval

  - path: /api/v1/auth/login
    method: POST
    description: Authenticate and receive JWT + refresh token
    access: PUBLIC
    request_body:
      email: string
      password: string
    response: 200 OK
      access_token: string (JWT, 15min TTL)
      refresh_token: string (7-day TTL)
      expires_in: 900
      member:
        member_id: uuid
        role: string
        org_id: uuid

  - path: /api/v1/auth/refresh
    method: POST
    description: Exchange refresh token for new access token
    access: AUTHENTICATED
    request_body:
      refresh_token: string
    response: 200 OK
      access_token: string
      expires_in: 900

  - path: /api/v1/auth/logout
    method: POST
    description: Revoke refresh token
    access: AUTHENTICATED
    response: 204 No Content

  - path: /api/v1/auth/forgot-password
    method: POST
    description: Initiate password reset flow
    access: PUBLIC
    request_body:
      email: string
    response: 202 Accepted

  - path: /api/v1/auth/reset-password
    method: POST
    description: Complete password reset with token
    access: PUBLIC
    request_body:
      token: string
      new_password: string
    response: 200 OK

# -------------------------------------------
# ORGANIZATIONS
# -------------------------------------------

  - path: /api/v1/organizations
    method: GET
    description: List organizations (super_admin only)
    access: super_admin
    query_params:
      page: integer (default 1)
      limit: integer (default 20, max 100)
    response: 200 OK (paginated list)

  - path: /api/v1/organizations/{org_id}
    method: GET
    description: Get organization details
    access: member+
    response: 200 OK
      org_id: uuid
      name: string
      denomination: string
      address: string
      timezone: string
      logo_url: string

  - path: /api/v1/organizations/{org_id}
    method: PUT
    description: Update organization settings
    access: admin, pastor
    request_body:
      name: string
      denomination: string
      address: string
      timezone: string
      logo_url: string
    response: 200 OK

# -------------------------------------------
# CAMPUSES
# -------------------------------------------

  - path: /api/v1/campuses
    method: GET
    description: List all campuses for the authenticated org
    access: member+
    query_params:
      is_primary: boolean
    response: 200 OK
      data: array of campus objects

  - path: /api/v1/campuses
    method: POST
    description: Create a new campus
    access: admin, pastor
    request_body:
      name: string (required)
      address: string
      city: string
      state: string
      zip: string
      is_primary: boolean
      accessibility_notes: string
      parking_info: string
    response: 201 Created

  - path: /api/v1/campuses/{campus_id}
    method: GET
    description: Get campus details including rooms
    access: member+
    response: 200 OK
      campus_id: uuid
      name: string
      rooms: array

  - path: /api/v1/campuses/{campus_id}
    method: PUT
    description: Update campus information
    access: admin, pastor
    response: 200 OK

  - path: /api/v1/campuses/{campus_id}
    method: DELETE
    description: Deactivate a campus (soft delete)
    access: admin, pastor
    response: 204 No Content

# -------------------------------------------
# ROOMS
# -------------------------------------------

  - path: /api/v1/campuses/{campus_id}/rooms
    method: GET
    description: List rooms for a campus
    access: member+
    query_params:
      min_capacity: integer
      has_av_equipment: boolean
      is_wheelchair_accessible: boolean
    response: 200 OK

  - path: /api/v1/campuses/{campus_id}/rooms
    method: POST
    description: Add a room to a campus
    access: admin, pastor
    request_body:
      name: string (required)
      capacity: integer
      has_av_equipment: boolean
      is_wheelchair_accessible: boolean
      has_childcare_nearby: boolean
      notes: string
    response: 201 Created

  - path: /api/v1/rooms/{room_id}
    method: GET
    description: Get room details
    access: member+
    response: 200 OK

  - path: /api/v1/rooms/{room_id}
    method: PUT
    description: Update room details
    access: admin, pastor
    response: 200 OK

  - path: /api/v1/rooms/{room_id}/availability
    method: GET
    description: Check room availability for a date range
    access: leader+
    query_params:
      start_date: date (required)
      end_date: date (required)
    response: 200 OK
      available_slots: array of {start, end}
      conflicts: array of event summaries

# -------------------------------------------
# MEMBERS
# -------------------------------------------

  - path: /api/v1/members
    method: GET
    description: List members (filtered by role, group, etc.)
    access: leader+ (scoped), admin/pastor (all)
    query_params:
      role: string
      is_active: boolean
      search: string (name/email)
      page: integer
      limit: integer
    response: 200 OK (paginated)

  - path: /api/v1/members/{member_id}
    method: GET
    description: Get member profile
    access: self (full), leader+ (limited), admin/pastor (full)
    response: 200 OK

  - path: /api/v1/members/{member_id}
    method: PUT
    description: Update member profile
    access: self (own profile), admin/pastor (any member)
    request_body:
      first_name: string
      last_name: string
      email: string
      phone: string
      role: string (admin/pastor only)
      avatar_url: string
    response: 200 OK

  - path: /api/v1/members/{member_id}
    method: DELETE
    description: Deactivate a member (soft delete)
    access: admin, pastor
    response: 204 No Content

  - path: /api/v1/members/me
    method: GET
    description: Get current authenticated member's profile
    access: AUTHENTICATED
    response: 200 OK

  - path: /api/v1/members/me/events
    method: GET
    description: Get events the current member is registered for or assigned to
    access: AUTHENTICATED
    query_params:
      type: string (registered | volunteering | leading)
      from: date
      to: date
    response: 200 OK

# -------------------------------------------
# EVENTS (Core Calendar)
# -------------------------------------------

  - path: /api/v1/events
    method: GET
    description: List events with filtering and search
    access: guest (public only), member+ (based on visibility)
    query_params:
      start_date: date (required)
      end_date: date (required)
      campus_id: uuid
      category_id: uuid
      event_type: string
      search: string
      is_recurring: boolean
      visibility: string
      status: string
      page: integer
      limit: integer
      sort: string (start_datetime | created_at)
      order: string (asc | desc)
    response: 200 OK
      data: array of event objects
      meta:
        total: integer
        page: integer
        total_pages: integer
        liturgical_season: object (current season context)

  - path: /api/v1/events
    method: POST
    description: Create a new event
    access: leader+ (scoped), admin, pastor
    request_body:
      title: string (required)
      description: string
      category_id: uuid (required)
      campus_id: uuid
      room_id: uuid
      event_type: string (required)
      start_datetime: datetime (required)
      end_datetime: datetime (required)
      is_all_day: boolean
      is_recurring: boolean
      recurrence_rule: string (RRULE format)
      recurrence_end_date: date
      max_capacity: integer
      requires_rsvp: boolean
      registration_url: string
      livestream_url: string
      childcare_available: boolean
      contact_member_id: uuid
      visibility: string (public | members_only | leaders_only)
    response: 201 Created
      event_id: uuid
      ...full event object

  - path: /api/v1/events/{event_id}
    method: GET
    description: Get full event details (includes registrations count, volunteers, scripture)
    access: based on event visibility
    response: 200 OK
      event_id: uuid
      title: string
      ...all fields
      registrations_count: integer
      spots_remaining: integer | null
      volunteers: array
      scripture_readings: array
      liturgical_season: object

  - path: /api/v1/events/{event_id}
    method: PUT
    description: Update an event
    access: leader+ (if creator/contact), admin, pastor
    request_body: (same fields as POST, all optional)
    response: 200 OK
    notes: |
      For recurring events, include update_scope param:
        - this_instance: only this occurrence
        - this_and_future: this and all future occurrences
        - all_instances: all occurrences

  - path: /api/v1/events/{event_id}
    method: DELETE
    description: Cancel or delete an event
    access: admin, pastor
    query_params:
      scope: string (this_instance | this_and_future | all_instances)
    request_body:
      cancellation_reason: string
    response: 204 No Content

  - path: /api/v1/events/{event_id}/cancel
    method: POST
    description: Cancel an event (sets status to cancelled, sends notifications)
    access: admin, pastor
    request_body:
      reason: string (required)
      notify_registered: boolean (default true)
    response: 200 OK
      status: cancelled
      notifications_sent: integer

  - path: /api/v1/events/{event_id}/duplicate
    method: POST
    description: Clone an event to a new date
    access: leader+, admin, pastor
    request_body:
      new_start_datetime: datetime (required)
      new_end_datetime: datetime (required)
      include_volunteers: boolean (default false)
    response: 201 Created (new event)

  - path: /api/v1/events/upcoming
    method: GET
    description: Get upcoming events (convenience endpoint for dashboard)
    access: member+
    query_params:
      days: integer (default 7, max 30)
      campus_id: uuid
      limit: integer (default 10)
    response: 200 OK

  - path: /api/v1/events/conflicts
    method: POST
    description: Check for scheduling conflicts before creating an event
    access: leader+
    request_body:
      campus_id: uuid
      room_id: uuid
      start_datetime: datetime
      end_datetime: datetime
    response: 200 OK
      has_conflicts: boolean
      conflicts: array of event summaries

# -------------------------------------------
# EVENT REGISTRATIONS / RSVP
# -------------------------------------------

  - path: /api/v1/events/{event_id}/registrations
    method: GET
    description: List all registrations for an event
    access: leader+ (if event contact), admin, pastor
    query_params:
      status: string (registered | waitlisted | cancelled)
      page: integer
      limit: integer
    response: 200 OK
      data: array of registration objects
      meta:
        total_registered: integer
        total_waitlisted: integer
        spots_remaining: integer | null

  - path: /api/v1/events/{event_id}/registrations
    method: POST
    description: RSVP / Register for an event
    access: member+
    request_body:
      member_id: uuid (optional, defaults to self)
      guest_name: string (for non-member guests)
      guest_email: string
      party_size: integer (default 1)
      notes: string
    response: 201 Created
      registration_id: uuid
      status: registered | waitlisted
    notes: |
      Auto-waitlists if max_capacity reached.
      Sends confirmation email on success.

  - path: /api/v1/events/{event_id}/registrations/{registration_id}
    method: PUT
    description: Update a registration (change party size, notes)
    access: self, admin, pastor
    response: 200 OK

  - path: /api/v1/events/{event_id}/registrations/{registration_id}
    method: DELETE
    description: Cancel a registration
    access: self, admin, pastor
    response: 204 No Content
    notes: Auto-promotes first waitlisted person if capacity opens.

  - path: /api/v1/events/{event_id}/registrations/export
    method: GET
    description: Export registrations as CSV
    access: leader+, admin, pastor
    response: 200 OK (text/csv)

# -------------------------------------------
# EVENT CATEGORIES
# -------------------------------------------

  - path: /api/v1/categories
    method: GET
    description: List all event categories
    access: member+
    response: 200 OK

  - path: /api/v1/categories
    method: POST
    description: Create a new category
    access: admin, pastor
    request_body:
      name: string (required)
      color_hex: string (required, e.g. "#4A90D9")
      icon: string
      sort_order: integer
    response: 201 Created

  - path: /api/v1/categories/{category_id}
    method: PUT
    description: Update a category
    access: admin, pastor
    response: 200 OK

  - path: /api/v1/categories/{category_id}
    method: DELETE
    description: Delete a category (must reassign events first)
    access: admin, pastor
    response: 204 No Content | 409 Conflict (if events exist)

# -------------------------------------------
# LITURGICAL SEASONS
# -------------------------------------------

  - path: /api/v1/liturgical-seasons
    method: GET
    description: List liturgical seasons for a year
    access: member+
    query_params:
      year: integer (default current year)
    response: 200 OK
      data: array of season objects
      current_season: object (today's active season)

  - path: /api/v1/liturgical-seasons/current
    method: GET
    description: Get the current liturgical season
    access: PUBLIC
    response: 200 OK
      season_id: uuid
      name: string
      color_hex: string
      start_date: date
      end_date: date
      week_number: integer
      description: string

  - path: /api/v1/liturgical-seasons
    method: POST
    description: Create/define a liturgical season
    access: pastor
    request_body:
      name: string (required)
      color_hex: string
      start_date: date (required)
      end_date: date (required)
      description: string
      year: integer (required)
    response: 201 Created

  - path: /api/v1/liturgical-seasons/{season_id}
    method: PUT
    description: Update a liturgical season
    access: pastor
    response: 200 OK

  - path: /api/v1/liturgical-seasons/generate
    method: POST
    description: Auto-generate seasons for a year based on denomination template
    access: pastor
    request_body:
      year: integer (required)
      template: string (catholic | lutheran | anglican | orthodox | custom)
    response: 201 Created
      seasons_created: integer

# -------------------------------------------
# SCRIPTURE READINGS
# -------------------------------------------

  - path: /api/v1/scripture-readings
    method: GET
    description: List scripture readings for a date range
    access: member+
    query_params:
      start_date: date (required)
      end_date: date (required)
      reading_type: string (first_reading | psalm | gospel | epistle)
      event_id: uuid
    response: 200 OK

  - path: /api/v1/scripture-readings/today
    method: GET
    description: Get today's scripture readings
    access: PUBLIC
    response: 200 OK
      date: date
      readings: array of reading objects

  - path: /api/v1/scripture-readings
    method: POST
    description: Create a scripture reading assignment
    access: pastor
    request_body:
      event_id: uuid
      reading_date: date (required)
      reading_type: string
      reference: string (required, e.g. "John 3:16-21")
      text_content: string
      sort_order: integer
    response: 201 Created

  - path: /api/v1/scripture-readings/{reading_id}
    method: PUT
    description: Update a scripture reading
    access: pastor
    response: 200 OK

  - path: /api/v1/scripture-readings/{reading_id}
    method: DELETE
    description: Remove a scripture reading
    access: pastor
    response: 204 No Content

  - path: /api/v1/scripture-readings/import
    method: POST
    description: Bulk import lectionary readings for a liturgical year
    access: pastor
    request_body:
      lectionary: string (rcl | catholic | lutheran)
      year: integer
      cycle: string (A | B | C)
    response: 201 Created
      readings_imported: integer

# -------------------------------------------
# PRAYER FOCUSES
# -------------------------------------------

  - path: /api/v1/prayer-focuses
    method: GET
    description: List prayer focuses
    access: member+
    query_params:
      start_date: date
      end_date: date
      prayer_type: string (weekly | daily | special)
    response: 200 OK

  - path: /api/v1/prayer-focuses/current
    method: GET
    description: Get the current prayer focus
    access: PUBLIC
    response: 200 OK

  - path: /api/v1/prayer-focuses
    method: POST
    description: Create a prayer focus
    access: pastor, admin
    request_body:
      title: string (required)
      description: string
      start_date: date (required)
      end_date: date (required)
      prayer_type: string
    response: 201 Created

  - path: /api/v1/prayer-focuses/{prayer_id}
    method: PUT
    description: Update a prayer focus
    access: pastor, admin
    response: 200 OK

  - path: /api/v1/prayer-focuses/{prayer_id}
    method: DELETE
    description: Delete a prayer focus
    access: pastor, admin
    response: 204 No Content

# -------------------------------------------
# MINISTRY GROUPS
# -------------------------------------------

  - path: /api/v1/groups
    method: GET
    description: List ministry groups
    access: member+
    query_params:
      group_type: string (small_group | ministry | committee | choir | class)
      campus_id: uuid
      is_active: boolean
      search: string
    response: 200 OK

  - path: /api/v1/groups
    method: POST
    description: Create a new ministry group
    access: admin, pastor
    request_body:
      name: string (required)
      description: string
      group_type: string
      leader_member_id: uuid
      meeting_day: string
      meeting_time: time
      campus_id: uuid
    response: 201 Created

  - path: /api/v1/groups/{group_id}
    method: GET
    description: Get group details including members
    access: member+
    response: 200 OK
      ...group fields
      members: array of {member, role, joined_at}
      upcoming_events: array

  - path: /api/v1/groups/{group_id}
    method: PUT
    description: Update group information
    access: group leader, admin, pastor
    response: 200 OK

  - path: /api/v1/groups/{group_id}
    method: DELETE
    description: Deactivate a group
    access: admin, pastor
    response: 204 No Content

  - path: /api/v1/groups/{group_id}/members
    method: GET
    description: List group members
    access: member+
    response: 200 OK

  - path: /api/v1/groups/{group_id}/members
    method: POST
    description: Add a member to a group
    access: group leader, admin, pastor
    request_body:
      member_id: uuid (required)
      role: string (default "member")
    response: 201 Created

  - path: /api/v1/groups/{group_id}/members/{member_id}
    method: PUT
    description: Update a member's group role
    access: group leader, admin, pastor
    response: 200 OK

  - path: /api/v1/groups/{group_id}/members/{member_id}
    method: DELETE
    description: Remove a member from a group
    access: self, group leader, admin, pastor
    response: 204 No Content

# -------------------------------------------
# VOLUNTEER MANAGEMENT
# -------------------------------------------

  - path: /api/v1/volunteer-roles
    method: GET
    description: List all volunteer roles
    access: member+
    response: 200 OK

  - path: /api/v1/volunteer-roles
    method: POST
    description: Create a volunteer role
    access: admin, pastor
    request_body:
      name: string (required)
      description: string
      min_volunteers: integer
      max_volunteers: integer
    response: 201 Created

  - path: /api/v1/volunteer-roles/{role_id}
    method: PUT
    description: Update a volunteer role
    access: admin, pastor
    response: 200 OK

  - path: /api/v1/volunteer-roles/{role_id}
    method: DELETE
    description: Delete a volunteer role
    access: admin, pastor
    response: 204 No Content | 409 Conflict (if active assignments)

  - path: /api/v1/volunteer-assignments
    method: GET
    description: List volunteer assignments (with filtering)
    access: volunteer+ (own), leader+, admin, pastor
    query_params:
      event_id: uuid
      member_id: uuid
      role_id: uuid
      status: string (assigned | confirmed | declined | swapped)
      start_date: date
      end_date: date
      has_gaps: boolean (filter events with unfilled roles)
    response: 200 OK

  - path: /api/v1/volunteer-assignments
    method: POST
    description: Create a volunteer assignment
    access: leader+, admin, pastor
    request_body:
      event_id: uuid (required)
      role_id: uuid (required)
      member_id: uuid (required)
      notes: string
    response: 201 Created
    notes: Sends notification to assigned volunteer.

  - path: /api/v1/volunteer-assignments/{assignment_id}
    method: PUT
    description: Update assignment (confirm, decline, swap)
    access: assigned volunteer (own), leader+, admin, pastor
    request_body:
      status: string
      notes: string
    response: 200 OK

  - path: /api/v1/volunteer-assignments/{assignment_id}
    method: DELETE
    description: Remove a volunteer assignment
    access: leader+, admin, pastor
    response: 204 No Content

  - path: /api/v1/volunteer-assignments/gaps
    method: GET
    description: Find events with unfilled volunteer positions
    access: leader+, admin, pastor
    query_params:
      start_date: date (required)
      end_date: date (required)
      campus_id: uuid
      role_id: uuid
    response: 200 OK
      gaps: array of
        event_id: uuid
        event_title: string
        event_datetime: datetime
        role_id: uuid
        role_name: string
        needed: integer
        assigned: integer
        shortfall: integer

  - path: /api/v1/volunteer-assignments/auto-schedule
    method: POST
    description: Auto-generate volunteer schedule based on availability and history
    access: admin, pastor
    request_body:
      start_date: date (required)
      end_date: date (required)
      campus_id: uuid
      role_ids: array of uuid (optional, all if omitted)
      strategy: string (round_robin | weighted | preference_based)
    response: 200 OK
      proposed_assignments: array
      conflicts: array
      status: draft (requires confirmation)

  - path: /api/v1/volunteer-assignments/auto-schedule/confirm
    method: POST
    description: Confirm and publish auto-generated schedule
    access: admin, pastor
    request_body:
      schedule_draft_id: uuid
      excluded_assignment_ids: array of uuid (optional)
    response: 201 Created
      assignments_created: integer
      notifications_sent: integer

  - path: /api/v1/volunteer-assignments/swap
    method: POST
    description: Request a shift swap between two volunteers
    access: volunteer+
    request_body:
      from_assignment_id: uuid (required)
      to_member_id: uuid (required)
      message: string
    response: 200 OK
      swap_status: pending_approval

# -------------------------------------------
# NOTIFICATIONS
# -------------------------------------------

  - path: /api/v1/notifications
    method: GET
    description: List notifications for current user
    access: AUTHENTICATED
    query_params:
      read: boolean
      notification_type: string
      page: integer
      limit: integer
    response: 200 OK

  - path: /api/v1/notifications
    method: POST
    description: Create and schedule a notification
    access: admin, pastor
    request_body:
      event_id: uuid
      title: string (required)
      message: string (required)
      notification_type: string (required)
      send_at: datetime
      audience: string (all | registered | volunteers | leaders)
    response: 201 Created

  - path: /api/v1/notifications/{notification_id}
    method: PUT
    description: Update a notification (before sending)
    access: admin, pastor
    response: 200 OK | 409 Conflict (already sent)

  - path: /api/v1/notifications/{notification_id}
    method: DELETE
    description: Cancel a scheduled notification
    access: admin, pastor
    response: 204 No Content

  - path: /api/v1/notifications/{notification_id}/read
    method: POST
    description: Mark notification as read
    access: AUTHENTICATED (own)
    response: 200 OK

  - path: /api/v1/notifications/read-all
    method: POST
    description: Mark all notifications as read
    access: AUTHENTICATED
    response: 200 OK
      marked_count: integer

# -------------------------------------------
# CALENDAR SYNC & EXPORT
# -------------------------------------------

  - path: /api/v1/calendar/export/ical
    method: GET
    description: Export events as iCal (.ics) feed
    access: member+
    query_params:
      campus_id: uuid
      category_id: uuid
      start_date: date
      end_date: date
    response: 200 OK (text/calendar)
    notes: Returns subscribable iCal feed URL

  - path: /api/v1/calendar/export/ical/subscribe
    method: POST
    description: Generate a unique subscription URL for calendar sync
    access: member+
    request_body:
      filters:
        campus_ids: array of uuid
        category_ids: array of uuid
    response: 201 Created
      subscription_url: string (unique, token-authenticated)
      format: ical

  - path: /api/v1/calendar/export/pdf
    method: GET
    description: Export monthly calendar as printable PDF
    access: member+
    query_params:
      month: integer (required)
      year: integer (required)
      campus_id: uuid
    response: 200 OK (application/pdf)

# -------------------------------------------
# SEARCH
# -------------------------------------------

  - path: /api/v1/search
    method: GET
    description: Global full-text search across events, groups, members
    access: member+ (results filtered by visibility/role)
    query_params:
      q: string (required, min 2 characters)
      type: string (events | groups | members | all)
      page: integer
      limit: integer
    response: 200 OK
      results: array of
        type: string
        id: uuid
        title: string
        snippet: string
        relevance_score: float

# -------------------------------------------
# ANALYTICS & REPORTING (Admin/Pastor)
# -------------------------------------------

  - path: /api/v1/analytics/attendance
    method: GET
    description: Attendance trends by event type and date range
    access: admin, pastor
    query_params:
      start_date: date (required)
      end_date: date (required)
      event_type: string
      campus_id: uuid
      granularity: string (daily | weekly | monthly)
    response: 200 OK
      data: array of {period, event_count, total_registrations, avg_attendance}

  - path: /api/v1/analytics/volunteers
    method: GET
    description: Volunteer participation metrics
    access: admin, pastor
    query_params:
      start_date: date (required)
      end_date: date (required)
    response: 200 OK
      total_assignments: integer
      confirmation_rate: float
      decline_rate: float
      gap_rate: float
      top_volunteers: array
      most_needed_roles: array

  - path: /api/v1/analytics/growth
    method: GET
    description: Member growth and engagement metrics
    access: admin, pastor
    query_params:
      start_date: date
      end_date: date
    response: 200 OK
      new_members: integer
      active_members: integer
      group_participation_rate: float
      event_engagement_rate: float

# -------------------------------------------
# WEBHOOKS (For External Integrations)
# -------------------------------------------

  - path: /api/v1/webhooks
    method: GET
    description: List registered webhooks
    access: admin
    response: 200 OK

  - path: /api/v1/webhooks
    method: POST
    description: Register a webhook endpoint
    access: admin
    request_body:
      url: string (required, HTTPS only)
      events: array of string (required)
        # Supported events:
        # event.created, event.updated, event.cancelled
        # registration.created, registration.cancelled
        # volunteer.assigned, volunteer.confirmed, volunteer.declined
        # member.created, member.deactivated
        # notification.sent
      secret: string (for HMAC signature verification)
    response: 201 Created
      webhook_id: uuid
      verify_token: string

  - path: /api/v1/webhooks/{webhook_id}
    method: DELETE
    description: Unregister a webhook
    access: admin
    response: 204 No Content

  - path: /api/v1/webhooks/{webhook_id}/test
    method: POST
    description: Send a test payload to a webhook
    access: admin
    response: 200 OK
      delivery_status: success | failed
      response_code: integer

# =============================================
# STANDARD RESPONSE FORMATS
# =============================================

response_formats:

  success_single:
    status: 200
    body:
      data: object
      meta:
        request_id: string

  success_list:
    status: 200
    body:
      data: array
      meta:
        total: integer
        page: integer
        limit: integer
        total_pages: integer
        request_id: string

  created:
    status: 201
    body:
      data: object
      meta:
        request_id: string

  error:
    status: 4xx | 5xx
    body:
      error:
        code: string (machine-readable)
        message: string (human-readable)
        details: array (field-level errors)
        request_id: string

# =============================================
# ERROR CODES
# =============================================

error_codes:
  - code: AUTH_001
    status: 401
    message: Invalid or expired token
  - code: AUTH_002
    status: 403
    message: Insufficient permissions for this action
  - code: AUTH_003
    status: 403
    message: Resource not visible at your access level
  - code: EVENT_001
    status: 404
    message: Event not found
  - code: EVENT_002
    status: 409
    message: Scheduling conflict detected
  - code: EVENT_003
    status: 422
    message: Invalid recurrence rule format
  - code: REG_001
    status: 409
    message: Event has reached maximum capacity
  - code: REG_002
    status: 409
    message: Already registered for this event
  - code: VOL_001
    status: 409
    message: Volunteer already assigned to this role for this event
  - code: VOL_002
    status: 409
    message: Maximum volunteers reached for this role
  - code: ROOM_001
    status: 409
    message: Room already booked for this time slot
  - code: GENERAL_001
    status: 400
    message: Invalid request body
  - code: GENERAL_002
    status: 429
    message: Rate limit exceeded
  - code: GENERAL_003
    status: 500
    message: Internal server error

# =============================================
# RATE LIMITING
# =============================================

rate_limits:
  - tier: guest
    limit: 30 requests/minute
  - tier: member
    limit: 100 requests/minute
  - tier: leader
    limit: 200 requests/minute
  - tier: admin/pastor
    limit: 500 requests/minute
  - tier: webhooks
    limit: 1000 events/minute (outbound)

headers:
  - X-RateLimit-Limit: integer (max requests for window)
  - X-RateLimit-Remaining: integer (remaining requests)
  - X-RateLimit-Reset: timestamp (window reset time)

# =============================================
# VERSIONING & DEPRECATION
# =============================================

versioning:
  strategy: URI path (/api/v1/, /api/v2/)
  deprecation_notice: 6 months via Sunset header
  headers:
    - Sunset: date (when version will be retired)
    - Deprecation: true/false
    - Link: <url>; rel="successor-version"
</parameter>
</invoke>Here's the fully expanded API layer for the Religious Organization Calendar App. It covers **75+ endpoints** across 14 resource groups:

## API Highlights

- **Authentication** — OAuth 2.0 with JWT, password reset flow, session management
- **Core Resources** — Full CRUD for organizations, campuses, rooms, members, events, categories
- **Liturgical/Spiritual** — Seasons (with auto-generation by denomination), scripture readings (with lectionary import), prayer focuses
- **Registration/RSVP** — Capacity-aware with auto-waitlisting and CSV export
- **Volunteer Scheduling** — Assignments, gap detection, auto-scheduling with round-robin/weighted strategies, shift swaps
- **Groups** — Ministry group lifecycle with membership management
- **Calendar Sync** — iCal export/subscription, PDF print export
- **Search** — Full-text global search across events, groups, and members
- **Analytics** — Attendance trends, volunteer metrics, growth/engagement reporting
- **Webhooks** — External integration with 11 subscribable event types
- **Notifications** — Scheduled sends, read/unread tracking, bulk mark-as-read

## Cross-Cutting Concerns

| Feature | Implementation |
|---------|---------------|
| **Auth** | OAuth 2.0 + JWT (15-min access, 7-day refresh) |
| **RBAC** | 7 roles: super_admin → guest with scoped permissions |
| **Rate Limiting** | 30–500 req/min by tier with standard headers |
| **Error Handling** | 13 typed error codes with machine-readable codes |
| **Pagination** | Cursor-based with `page`, `limit`, `total_pages` |
| **Versioning** | URI-path (`/api/v1/`) with 6-month deprecation via Sunset header |
| **Response Format** | Consistent `{data, meta}` envelope |

